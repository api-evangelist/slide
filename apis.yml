aid: slide
name: Slide
description: >-
  Slide is a modern, security-first Business Continuity and Disaster Recovery
  (BCDR) platform built exclusively for Managed Service Providers (MSPs).
  Founded by Datto creator Austin McChord, Slide pairs on-premise Slide Box
  appliances with the Slide Cloud to deliver always-encrypted, block-level
  backup, snapshot management, file and image restores, and virtualization.
  Its open REST API (api.slide.tech) gives MSPs full programmatic control to
  integrate, extend, and automate agents, devices, backups, snapshots,
  restores, networks, clients, users, alerts, and audit logs within their
  existing tooling. The platform uses AES-256 and ZFS native encryption,
  offers month-to-month subscriptions, and is SOC 2 Type 1 certified.
